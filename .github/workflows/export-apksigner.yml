name: Export apksigner

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/export-apksigner.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        shell: bash
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Collect signer tool
        shell: bash
        run: |
          mkdir -p signer-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signer-tool/apksigner.jar

      - name: Upload signer tool
        uses: actions/upload-artifact@v4
        with:
          name: apksigner-35
          path: signer-tool/apksigner.jar
          if-no-files-found: error
