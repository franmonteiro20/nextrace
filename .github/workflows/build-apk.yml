name: Build NextRace Limited Distribution

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned release APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Rename artifacts
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk NextRace-v1.5.0-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab NextRace-v1.5.0-unsigned.aab

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NextRace-v1.5.0-unsigned
          path: |
            NextRace-v1.5.0-unsigned.apk
            NextRace-v1.5.0-unsigned.aab
          if-no-files-found: error
